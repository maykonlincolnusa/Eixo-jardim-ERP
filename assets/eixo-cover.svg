<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Eixo portfolio cover</title>
  <desc id="desc">An abstract geometric cover for Eixo, a connected operations platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="58%" stop-color="#0B1D2A"/>
      <stop offset="100%" stop-color="#102A31"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#4ECAA3" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2D6A4F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6BD60"/>
      <stop offset="100%" stop-color="#CA6702"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D9E8E0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#background)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

  <g opacity="0.65" fill="none" stroke="#75D5B4" stroke-width="1.5">
    <path d="M944 98H1250L1418 266V458"/>
    <path d="M1023 40V193H1311L1510 392"/>
    <path d="M886 560H1114L1267 407H1515"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M1090 128L1206 128L1302 224L1206 320L1090 320L1186 224Z" fill="#173B3A" stroke="#5DD1A9" stroke-width="2"/>
    <path d="M1206 320L1302 224L1398 320L1302 416Z" fill="url(#accent)"/>
    <path d="M994 224L1090 128L1186 224L1090 320Z" fill="#2D6A4F"/>
    <path d="M1090 320L1186 224L1282 320L1186 416Z" fill="#0D2630" stroke="#5DD1A9" stroke-width="2"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="118" y="177" fill="#8EE2C1" font-size="18" font-weight="700" letter-spacing="5">CONNECTED OPERATIONS</text>
    <text x="112" y="332" fill="#F7FAFC" font-size="176" font-weight="800" letter-spacing="-10">eixo</text>
    <rect x="120" y="386" width="118" height="7" rx="3.5" fill="#E8A83E"/>
    <text x="120" y="448" fill="#C4D3D9" font-size="30" font-weight="400">A portfolio case study in thoughtful systems design.</text>
    <text x="120" y="520" fill="#8FA7B1" font-size="17" font-weight="600" letter-spacing="3">PRODUCT  /  PLATFORM  /  PRACTICE</text>
  </g>
</svg>
